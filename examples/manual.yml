name: HPC CB
run-name: >-
  ${{ inputs.context_run_id && format('HPC resume {0}', inputs.context_run_id)
  || inputs.pull_request && format('HPC PR {0} {1}', inputs.pull_request, inputs.source_sha)
  || 'HPC CB' }}

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Leave empty, or a PR number to run a reviewed commit of that PR.
        type: string
        default: ''
      source_sha:
        description: Leave empty, or the full hash of the reviewed PR commit.
        type: string
        default: ''
      context_run_id:
        description: Leave empty, set by continuation or for a manual resume.
        type: string
        default: ''
      command_comment:
        description: Leave empty, set by the PR command.
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@REVIEWED_COMMIT
    with:
      gitlab_hostname: ${{ vars.GITLAB_HOSTNAME }}
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
