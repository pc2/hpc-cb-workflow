name: HPC CB

on:
  workflow_dispatch:
    inputs:
      context_run_id:
        description: The original GitHub run, leave empty to start jobs.
        type: string
        default: ''
      pull_request:
        description: An optional PR whose head is the selected commit.
        type: string
        default: ''
      source_sha:
        description: The reviewed PR head commit.
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    if: vars.GITLAB_PROJECT_ID != ''
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@REVIEWED_COMMIT
    with:
      gitlab_hostname: ${{ vars.GITLAB_HOSTNAME }}
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      context_run_id: ${{ inputs.context_run_id }}
      pull_request: ${{ inputs.pull_request }}
      source_sha: ${{ inputs.source_sha }}
      pipeline_variables: EXPECTED_COMMIT_SHA=${{ inputs.source_sha || github.sha }}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
