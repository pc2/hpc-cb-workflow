name: HPC benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      context_run_id:
        description: The original run to resume.
        type: string
        default: ''
      pull_request:
        description: The reviewed PR number.
        type: string
        default: ''
      source_sha:
        description: The reviewed PR head commit.
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  checks: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@REVIEWED_COMMIT
    with:
      gitlab_hostname: ${{ vars.GITLAB_HOSTNAME }}
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      context_run_id: ${{ inputs.context_run_id }}
      pull_request: ${{ inputs.pull_request }}
      source_sha: ${{ inputs.source_sha }}
      pipeline_variables: EXPECTED_COMMIT_SHA=${{ inputs.source_sha || github.sha }}
      benchmark: >-
        {"mode":"history","branch":"hpc-results","suites":[
          {"name":"CPU measurements","tool":"customSmallerIsBetter",
           "archive":"benchmark.zip","file":"results/benchmark.json",
           "directory":"bench/cpu","alert_threshold":"115%",
           "fail_threshold":"150%"}]}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
