name: HPC benchmarks
run-name: >-
  ${{ inputs.context_run_id && format('HPC resume {0}', inputs.context_run_id)
  || inputs.pull_request && format('HPC PR {0} {1}', inputs.pull_request, inputs.source_sha)
  || github.event.head_commit.message || 'HPC benchmarks' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Validation jobs to run, all, none or cpu and gpu joined by +.
        type: string
        default: all
      benchmarks:
        description: Benchmarks to run, all, none or cpu and gpu joined by +.
        type: string
        default: all
      pull_request:
        description: Leave empty, or a PR number to run a reviewed commit of that PR.
        type: string
        default: ''
      source_sha:
        description: Leave empty, or the full hash of the reviewed PR commit.
        type: string
        default: ''
      context_run_id:
        description: Leave empty, set by continuation or for a manual resume.
        type: string
        default: ''
      command_comment:
        description: Leave empty, set by the PR command.
        type: string
        default: ''

permissions:
  contents: write
  actions: write
  checks: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  hpc:
    uses: pc2/hpc-cb-workflow/.github/workflows/hpc-pipeline.yml@REVIEWED_COMMIT
    with:
      gitlab_hostname: ${{ vars.GITLAB_HOSTNAME }}
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      pipeline_variables: |
        CHECKS=${{ inputs.checks || 'all' }}
        BENCHMARKS=${{ inputs.benchmarks || 'all' }}
      variable_patterns: |
        CHECKS=none|all|(cpu|gpu)(\+(cpu|gpu))*
        BENCHMARKS=none|all|(cpu|gpu)(\+(cpu|gpu))*
      benchmark: >-
        {"mode":"history","branch":"hpc-results","suites":[
          {"name":"CPU","archive":"bench-cpu.zip","file":"results/benchmark.json",
           "directory":"bench","alert_threshold":"115%","fail_threshold":"150%"},
          {"name":"GPU","archive":"bench-gpu.zip","file":"results/benchmark.json",
           "directory":"bench","alert_threshold":"120%","fail_threshold":"200%"}]}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
