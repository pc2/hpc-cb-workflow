name: Benchmark results

on:
  workflow_call:
    inputs:
      context_run_id:
        type: string
        required: true
      artifact:
        type: string
        required: true
      config:
        type: string
        required: true
      suite:
        type: string
        required: true

permissions:
  contents: write
  actions: read
  checks: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: hpc-history-${{ github.repository }}-${{ fromJSON(inputs.config).branch || 'hpc-results' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: hpc-context
          run-id: ${{ inputs.context_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/benchmark-context
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/benchmark-artifacts
      - name: Install reporting helper
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/benchmark_support.py" <<'PY'
          # EMBED benchmark_support.py
          PY
      - name: Prepare benchmark comparison
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config }}
          SUITE: ${{ inputs.suite }}
          CONTEXT: ${{ runner.temp }}/benchmark-context/context.json
          ARTIFACTS: ${{ runner.temp }}/benchmark-artifacts
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 "$RUNNER_TEMP/benchmark_support.py" prepare
      - name: Compare and generate history
        id: benchmark
        if: steps.prepare.outputs.duplicate != 'true'
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc
        with:
          name: ${{ steps.prepare.outputs.name }}
          tool: ${{ steps.prepare.outputs.tool }}
          output-file-path: ${{ steps.prepare.outputs.file }}
          ref: ${{ steps.prepare.outputs.sha }}
          github-token: ${{ github.token }}
          gh-pages-branch: ${{ steps.prepare.outputs.branch }}
          benchmark-data-dir-path: ${{ steps.prepare.outputs.directory }}
          skip-fetch-gh-pages: true
          auto-push: false
          summary-always: true
          alert-threshold: ${{ steps.prepare.outputs.warning }}
          fail-threshold: ${{ steps.prepare.outputs.failure }}
          fail-on-alert: true
      - name: Record history and report to the PR
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.benchmark.outcome }}
        run: python3 "$RUNNER_TEMP/benchmark_support.py" finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.report.outputs.recorded == 'false' && steps.prepare.outputs.duplicate != 'true'
        with:
          name: ${{ steps.prepare.outputs.receipt }}
          path: ${{ runner.temp }}/receipt.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.report.outputs.recorded == 'true'
        with:
          name: benchmark-site-${{ strategy.job-index }}-${{ github.job }}-${{ fromJSON(inputs.suite).name }}
          path: ${{ steps.prepare.outputs.directory }}
          overwrite: true
      - name: Report an unavailable comparison
        if: failure() && steps.report.outputs.verdict == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: ${{ runner.temp }}/benchmark-context/context.json
          SUITE: ${{ inputs.suite }}
        run: python3 "$RUNNER_TEMP/benchmark_support.py" unavailable
      - name: Set regression result
        if: always()
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: test "$VERDICT" = success
