name: HPC command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dispatch:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/hpc')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize and dispatch the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CB_TEST_ACTOR: ${{ vars.CB_TEST_ACTOR }}
          CB_COMMAND_WORKFLOW: ${{ vars.CB_COMMAND_WORKFLOW || 'hpc-pr.yml' }}
        run: |
          python3 - <<'PY'
          # EMBED hpc_command.py
          PY
