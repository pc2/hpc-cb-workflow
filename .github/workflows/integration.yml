# Runs the reusable workflow against the configured GitLab project.
# The mirrored commit is this repository, its .gitlab-ci.yml defines the jobs.

name: Integration
run-name: ${{ inputs.context_run_id != '' && format('Integration resume {0}', inputs.context_run_id) || format('Integration {0}', inputs.scenario) }}

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: The pipeline outcome to verify.
        type: choice
        options: [success, failure, handover, handover_failure, benchmark]
        default: success
      pull_request:
        description: An optional PR whose head is the selected commit.
        type: string
        default: ''
      context_run_id:
        description: The original GitHub run, set by automatic continuation.
        type: string
        default: ''

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: integration-${{ inputs.context_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  hpc:
    if: vars.GITLAB_PROJECT_ID != ''
    uses: ./.github/workflows/hpc-pipeline.yml
    with:
      gitlab_hostname: ${{ vars.GITLAB_HOSTNAME }}
      gitlab_project_id: ${{ vars.GITLAB_PROJECT_ID }}
      max_wait_minutes: ${{ startsWith(inputs.scenario, 'handover') && inputs.context_run_id == '' && '1' || '330' }}
      expected_pipeline_status: ${{ (inputs.scenario == 'failure' || inputs.scenario == 'handover_failure') && 'failed' || 'success' }}
      pipeline_variables: |
        SCENARIO=${{ inputs.scenario || 'success' }}
    secrets:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}

  verify:
    name: Verify integration
    needs: hpc
    if: ${{ !cancelled() && needs.hpc.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    env:
      GITLAB_HOSTNAME: ${{ vars.GITLAB_HOSTNAME }}
      GITLAB_PROJECT_ID: ${{ vars.GITLAB_PROJECT_ID }}
      CONTEXT_RUN_ID: ${{ inputs.context_run_id || github.run_id }}
      CONTINUATION: ${{ inputs.context_run_id != '' }}
      HPC_RESULT: ${{ needs.hpc.result }}
      PIPELINE_STATUS: ${{ needs.hpc.outputs.pipeline_status }}
    steps:
      - name: Download pipeline context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # Use version 8.0.2.
        with:
          name: hpc-context
          run-id: ${{ env.CONTEXT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/hpc-context
      - name: Read the pipeline
        id: pipeline
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          INPUT_SCENARIO: ${{ inputs.scenario || 'success' }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/hpc-context/context.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson run "$CONTEXT_RUN_ID" \
            '.repository == $repo and .run_id == $run' "$context"
          pipeline_id=$(jq -r .pipeline_id "$context")
          sha=$(jq -r .sha "$context")
          api="https://$GITLAB_HOSTNAME/api/v4/projects/$GITLAB_PROJECT_ID/pipelines/$pipeline_id"
          gitlab() {
            curl --fail --silent --show-error --retry 3 --max-time 60 --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$1"
          }
          pipeline=$(gitlab "$api")
          jq -e --arg sha "$sha" --arg ref "$(jq -r .ref "$context")" --argjson id "$pipeline_id" \
            '.sha == $sha and .ref == $ref and .id == $id and .source == "trigger"' <<< "$pipeline"
          variables=$(gitlab "$api/variables")
          jq -e --arg sha "$sha" 'any(.[]; .key == "EXPECTED_COMMIT_SHA" and .value == $sha)' <<< "$variables"
          scenario=$(jq -er '.[] | select(.key == "SCENARIO") | .value' <<< "$variables")
          [[ $scenario =~ ^(success|failure|handover|handover_failure|benchmark)$ ]]
          if [[ $CONTINUATION != true ]]; then
            [[ $scenario == "$INPUT_SCENARIO" ]]
          fi
          # The first run of a handover ends before the pipeline, every other run collects results.
          collected=true
          if [[ $scenario == handover* && $CONTINUATION != true ]]; then
            collected=false
          fi
          expected_status=success
          if [[ $scenario == failure || $scenario == handover_failure ]]; then
            expected_status=failed
          fi
          status=$(jq -r .status <<< "$pipeline")
          jobs=$(gitlab "$api/jobs?per_page=100")
          jq -e 'any(.[]; .name == "quick")' <<< "$jobs"
          if [[ $collected == true ]]; then
            [[ $status == "$expected_status" ]]
            jq -e 'any(.[]; .name == "quick" and .status == "success")' <<< "$jobs"
          fi
          case $scenario in
            failure) jq -e 'any(.[]; .name == "fail")' <<< "$jobs" ;;
            handover*) jq -e 'any(.[]; .name == "slow")' <<< "$jobs" ;;
            benchmark) jq -e 'any(.[]; .name == "benchmark" and .status == "success")' <<< "$jobs" ;;
          esac
          {
            printf 'pipeline_id=%s\nsha=%s\nscenario=%s\n' "$pipeline_id" "$sha" "$scenario"
            printf 'collected=%s\nstatus=%s\n' "$collected" "$status"
            printf 'pull_request=%s\n' "$(jq -r .pull_request "$context")"
          } >> "$GITHUB_OUTPUT"
          printf 'Pipeline %s for commit %s is %s, scenario %s.\n' "$pipeline_id" "$sha" "$status" "$scenario" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the GitHub result
        shell: bash
        env:
          SCENARIO: ${{ steps.pipeline.outputs.scenario }}
          COLLECTED: ${{ steps.pipeline.outputs.collected }}
        run: |
          set -euo pipefail
          [[ $HPC_RESULT == success ]]
          if [[ $COLLECTED == true ]]; then
            expected=success
            if [[ $SCENARIO == failure || $SCENARIO == handover_failure ]]; then
              expected=failed
            fi
            [[ $PIPELINE_STATUS == "$expected" ]]
          else
            [[ -z $PIPELINE_STATUS ]]
          fi
      - name: Verify check runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
          SHA: ${{ steps.pipeline.outputs.sha }}
          COLLECTED: ${{ steps.pipeline.outputs.collected }}
          STATUS: ${{ steps.pipeline.outputs.status }}
        run: |
          set -euo pipefail
          prefix="gitlab/$GITLAB_PROJECT_ID/$PIPELINE_ID/"
          checks=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" |
            jq --arg prefix "$prefix" '[.check_runs[] | select(.name | startswith($prefix))]')
          jq -e --arg prefix "$prefix" 'any(.[]; .name == $prefix + "quick") and any(.[]; .name == $prefix + "pipeline")' <<< "$checks"
          if [[ $COLLECTED == true ]]; then
            conclusion=success
            if [[ $STATUS == failed ]]; then
              conclusion=failure
            fi
            jq -e --arg name "${prefix}pipeline" --arg conclusion "$conclusion" \
              'any(.[]; .name == $name and .status == "completed" and .conclusion == $conclusion)' <<< "$checks"
          fi
      - name: Verify the continuation run
        id: continuation
        if: steps.pipeline.outputs.collected == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          for attempt in $(seq 1 12); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?event=workflow_dispatch&branch=$default_branch&per_page=100")
            next_run=$(jq -r --arg title "Integration resume $CONTEXT_RUN_ID" --argjson run "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.id > $run and .display_title == $title)] | min_by(.id).id // empty' <<< "$runs")
            if [[ -n $next_run ]]; then
              printf 'run_id=%s\n' "$next_run" >> "$GITHUB_OUTPUT"
              echo 'A continuation run monitors the pipeline on the default branch.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo '::error::No continuation run was dispatched on the default branch.'
          exit 1
      - name: Download collected artifacts
        if: steps.pipeline.outputs.collected == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # Use version 8.0.2.
        with:
          name: gitlab-${{ env.GITLAB_PROJECT_ID }}-${{ steps.pipeline.outputs.pipeline_id }}
          path: ${{ runner.temp }}/collected
      - name: Verify collected artifacts
        if: steps.pipeline.outputs.collected == 'true'
        shell: bash
        env:
          SHA: ${{ steps.pipeline.outputs.sha }}
          SCENARIO: ${{ steps.pipeline.outputs.scenario }}
        run: |
          set -euo pipefail
          ls -l "$RUNNER_TEMP/collected"
          [[ $(unzip -p "$RUNNER_TEMP/collected/quick.zip" results/commit.txt) == "$SHA" ]]
          if [[ $SCENARIO == handover_failure ]]; then
            [[ $(unzip -p "$RUNNER_TEMP/collected/slow.zip" results/failure.txt) == "$SHA" ]]
          fi
          if [[ $SCENARIO == benchmark ]]; then
            allocation=$(unzip -p "$RUNNER_TEMP/collected/benchmark.zip" results/slurm-job-id.txt)
            [[ $allocation =~ ^[0-9]+$ ]]
            unzip -p "$RUNNER_TEMP/collected/benchmark.zip" results/benchmark.json |
              jq -e --arg sha "$SHA" '.schema == 1 and .sha == $sha and .unit == "seconds"
                and (.value | type == "number" and . > 0) and .threads == 1 and .blas_threads == 1'
          fi
      - name: Verify the PR comment
        if: steps.pipeline.outputs.collected == 'true' && steps.pipeline.outputs.pull_request != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pipeline.outputs.pull_request }}
          PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
          SHA: ${{ steps.pipeline.outputs.sha }}
          STATUS: ${{ steps.pipeline.outputs.status }}
        run: |
          set -euo pipefail
          marker="<!-- hpc-cb:$GITLAB_PROJECT_ID:$PIPELINE_ID -->"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" |
            jq -se --arg marker "$marker" --arg sha "$SHA" --arg status "**$STATUS**" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))]
                | length == 1 and (.[0].body | contains($sha) and contains($status))'
      - name: Save verified result
        shell: bash
        env:
          PIPELINE_ID: ${{ steps.pipeline.outputs.pipeline_id }}
          SHA: ${{ steps.pipeline.outputs.sha }}
          SCENARIO: ${{ steps.pipeline.outputs.scenario }}
          COLLECTED: ${{ steps.pipeline.outputs.collected }}
          NEXT_RUN_ID: ${{ steps.continuation.outputs.run_id || '0' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/integration-result"
          jq -n --arg scenario "$SCENARIO" --arg sha "$SHA" --arg result "$HPC_RESULT" \
            --arg status "$PIPELINE_STATUS" \
            --argjson pipeline "$PIPELINE_ID" --argjson origin "$CONTEXT_RUN_ID" \
            --argjson collected "$COLLECTED" --argjson next "$NEXT_RUN_ID" \
            '{scenario: $scenario, sha: $sha, result: $result, pipeline_status: $status, pipeline_id: $pipeline,
              context_run_id: $origin, collected: $collected, next_run_id: $next}' \
            > "$RUNNER_TEMP/integration-result/result.json"
      - name: Upload verified result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-result
          path: ${{ runner.temp }}/integration-result/result.json
          overwrite: true
          if-no-files-found: error
