name: Workflow checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Use version 7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Use version 7.0.1.
        with:
          repository: pc2/github2lab_action
          ref: 123ecb3eb721d8c93bf8797a9e8f6237f3ef356a
          path: .tmp/github2lab_action
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # Use version 7.1.0.
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_reports.py' -v
      - run: python -m unittest discover -s tests -p 'test_benchmarks.py' -v
      - run: python tests/test_workflow.py
        env:
          GITHUB2LAB_SOURCE: ${{ github.workspace }}/.tmp/github2lab_action
