name: GitLab pipeline

on:
  workflow_call:
    inputs:
      gitlab_hostname:
        type: string
        required: true
      gitlab_project_id:
        type: string
        required: true
      pipeline_variables:
        type: string
        default: ''
      variable_patterns:
        description: Allowed values of pipeline variables, one NAME=REGEX per line, the expression must match the whole value.
        type: string
        default: ''
      context_run_id:
        description: The original GitHub run, set when resuming monitoring.
        type: string
        default: ''
      pull_request:
        description: An optional PR whose head is the selected commit.
        type: string
        default: ''
      source_sha:
        description: The reviewed PR head commit, used with pull_request.
        type: string
        default: ''
      command_comment:
        description: The PR comment whose author authorized the run, set by the HPC command.
        type: string
        default: ''
      benchmark:
        description: Optional JSON containing publication settings and benchmark suites.
        type: string
        default: '{}'
      expected_pipeline_status:
        description: The required terminal status, failed is reserved for deliberate failure tests.
        type: string
        default: success
      max_wait_minutes:
        description: Minutes one run monitors before continuing in another run, at most 330.
        type: string
        default: '330'
      collect_timeout_minutes:
        description: Minutes for downloading and uploading the artifacts after the pipeline finished, at most 360.
        type: string
        default: '60'
    secrets:
      GITLAB_TOKEN:
        required: true
      GITLAB_TRIGGER_TOKEN:
        required: false
    outputs:
      pipeline_status:
        description: The verified terminal GitLab status, empty until collection runs.
        value: ${{ jobs.collect.outputs.pipeline_status }}

permissions:
  contents: write
  checks: write
  actions: write
  pull-requests: write
  pages: write
  id-token: write

# A called workflow sees the caller's workflow_dispatch event, so callers need not pass these inputs through.
env:
  GITLAB_HOSTNAME: ${{ inputs.gitlab_hostname }}
  GITLAB_PROJECT_ID: ${{ inputs.gitlab_project_id }}
  HPC_CONTEXT_RUN_ID: ${{ inputs.context_run_id || github.event.inputs.context_run_id }}
  HPC_PULL_REQUEST: ${{ inputs.pull_request || github.event.inputs.pull_request }}
  HPC_SOURCE_SHA: ${{ inputs.source_sha || github.event.inputs.source_sha }}
  HPC_COMMAND_COMMENT: ${{ inputs.command_comment || github.event.inputs.command_comment }}

jobs:
  start:
    name: Start on GitLab
    # Forks without a configured GitLab project skip the whole run, unsupported events fail in Authorize the run.
    if: >-
      (inputs.context_run_id || github.event.inputs.context_run_id) == '' && github.run_attempt == 1 &&
      (inputs.gitlab_project_id != '' || !github.event.repository.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check caller inputs
        shell: bash
        env:
          PASSED: ${{ toJSON(inputs) }}
          DISPATCHED: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          for name in pull_request source_sha command_comment; do
            passed=$(jq -r --arg name "$name" '.[$name] // ""' <<< "$PASSED")
            dispatched=$(jq -r --arg name "$name" '(. // {})[$name] // ""' <<< "$DISPATCHED")
            if [[ -n $passed && -n $dispatched && $passed != "$dispatched" ]]; then
              echo "::error::The caller passes $name $passed but was dispatched with $dispatched, pass the input unchanged or omit it."
              exit 1
            fi
          done
      # Reviewed code on the default branch runs for every trigger, other commits need an authorized person.
      - name: Authorize the run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          PR: ${{ env.HPC_PULL_REQUEST }}
          COMMENT: ${{ env.HPC_COMMAND_COMMENT }}
          SELECTED_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
        run: |
          set -euo pipefail
          allowed() {
            local permission
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$1/permission" --jq .permission) || return 1
            [[ $permission == write || $permission == admin ]]
          }
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [[ -n $default_branch ]]
          if [[ $EVENT == schedule || ( $EVENT == push && $GITHUB_REF == "refs/heads/$default_branch" ) ]]; then
            echo "Started by $EVENT on the default branch."
            exit 0
          fi
          if [[ $EVENT != workflow_dispatch ]]; then
            echo "::error::The workflow runs on pushes to $default_branch, schedules and dispatches, not on $EVENT for $GITHUB_REF."
            exit 1
          fi
          if [[ -z $PR && -z $COMMENT && $GITHUB_REF == "refs/heads/$default_branch" ]]; then
            echo "Started on the default branch $default_branch."
            exit 0
          fi
          if [[ -z $COMMENT ]]; then
            if ! allowed "$ACTOR"; then
              echo "::error::$ACTOR started the run without repository write access."
              exit 1
            fi
            echo "Started by $ACTOR."
            exit 0
          fi
          # The comment author needs repository write access and must name the commit.
          [[ $COMMENT =~ ^[1-9][0-9]*$ && $PR =~ ^[1-9][0-9]*$ ]]
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT")
          jq -e --arg url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR" '.issue_url == $url' <<< "$comment" > /dev/null || {
            echo "::error::Comment $COMMENT does not belong to PR $PR."
            exit 1
          }
          author=$(jq -r .user.login <<< "$comment")
          if ! allowed "$author"; then
            echo "::error::Comment $COMMENT was written by $author without repository write access."
            exit 1
          fi
          read -ra words <<< "$(jq -r '.body | gsub("\\s+"; " ")' <<< "$comment")"
          [[ ${words[0]:-} == /hpc ]] || {
            echo "::error::Comment $COMMENT is not an /hpc command."
            exit 1
          }
          for word in "${words[@]:1}"; do
            if [[ $word =~ ^[0-9a-f]{40}$ && $SELECTED_SHA == "$word" ]]; then
              echo "Authorized by $author in comment $COMMENT."
              exit 0
            fi
          done
          echo "::error::Comment $COMMENT does not name commit $SELECTED_SHA."
          exit 1
      - name: Validate configuration
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          PR: ${{ env.HPC_PULL_REQUEST }}
          SELECTED_SHA: ${{ env.HPC_SOURCE_SHA }}
          BENCHMARK: ${{ inputs.benchmark }}
          EXPECTED_PIPELINE_STATUS: ${{ inputs.expected_pipeline_status }}
          COLLECT_TIMEOUT_MINUTES: ${{ inputs.collect_timeout_minutes }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ -n $GITLAB_TOKEN ]] || fail 'Configure the GITLAB_TOKEN secret and pass it to the workflow.'
          [[ -n $GITLAB_TRIGGER_TOKEN ]] || fail 'Configure the GITLAB_TRIGGER_TOKEN secret and pass it to the workflow.'
          [[ $GITLAB_PROJECT_ID =~ ^[1-9][0-9]*$ ]] || fail "gitlab_project_id must be the numeric GitLab project ID, not '$GITLAB_PROJECT_ID'."
          [[ $GITLAB_HOSTNAME =~ ^[a-zA-Z0-9.-]+$ ]] || fail "gitlab_hostname must be a hostname without protocol or path, not '$GITLAB_HOSTNAME'."
          [[ -z $PR || $PR =~ ^[1-9][0-9]*$ ]] || fail "pull_request must be a PR number, not '$PR'."
          [[ -z $SELECTED_SHA || -n $PR ]] || fail 'source_sha needs pull_request, it selects a commit of that PR.'
          [[ -z $SELECTED_SHA || $SELECTED_SHA =~ ^[0-9a-f]{40}$ ]] || fail "source_sha must be a full 40 character commit hash, not '$SELECTED_SHA'."
          jq -e 'type == "object" and ((.suites // []) | type == "array")' <<< "$BENCHMARK" > /dev/null 2>&1 ||
            fail 'benchmark must be a JSON object whose suites, if given, form an array.'
          [[ $EXPECTED_PIPELINE_STATUS == success || $EXPECTED_PIPELINE_STATUS == failed ]] ||
            fail "expected_pipeline_status must be success or failed, not '$EXPECTED_PIPELINE_STATUS'."
          [[ $COLLECT_TIMEOUT_MINUTES =~ ^[1-9][0-9]*$ && $COLLECT_TIMEOUT_MINUTES -le 360 ]] ||
            fail "collect_timeout_minutes must be between 1 and 360, not '$COLLECT_TIMEOUT_MINUTES'."
      # Continuation dispatches the caller on the default branch, a missing caller or input surfaces only after max_wait_minutes.
      - name: Check continuation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .path)
          path=${path%%@*}
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          if ! caller=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$default_branch" --jq .content 2> /dev/null | base64 -d); then
            echo "::warning::$path is missing on $default_branch, monitoring longer than max_wait_minutes cannot continue in another run."
          elif ! grep -q 'workflow_dispatch' <<< "$caller" || ! grep -Eq '^[[:space:]]+context_run_id:' <<< "$caller"; then
            echo "::warning::$path on $default_branch lacks the workflow_dispatch input context_run_id, monitoring longer than max_wait_minutes cannot continue in another run."
          fi
      # The GitLab workflow rule compares EXPECTED_COMMIT_SHA with the mirrored commit, so callers cannot get it wrong.
      - name: Compose pipeline variables
        id: variables
        shell: bash
        env:
          PIPELINE_VARIABLES: ${{ inputs.pipeline_variables }}
          VARIABLE_PATTERNS: ${{ inputs.variable_patterns }}
          SELECTED_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $SELECTED_SHA =~ ^[0-9a-f]{40}$ ]]
          lines=("EXPECTED_COMMIT_SHA=$SELECTED_SHA")
          declare -A seen=([EXPECTED_COMMIT_SHA]=1)
          while IFS= read -r line; do
            [[ -n $line ]] || continue
            key=${line%%=*}
            if [[ $key == "$line" || ! $key =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              fail "The pipeline variable line '$line' is not of the form KEY=VALUE."
            fi
            if [[ $key == EXPECTED_COMMIT_SHA ]]; then
              [[ ${line#*=} == "$SELECTED_SHA" ]] ||
                fail "Omit EXPECTED_COMMIT_SHA from pipeline_variables, the workflow sets it to $SELECTED_SHA."
              continue
            fi
            [[ -z ${seen[$key]:-} ]] || fail "The pipeline variable $key is set twice."
            seen[$key]=${line#*=}
            lines+=("$line")
          done <<< "$PIPELINE_VARIABLES"
          # Patterns restrict values that reach GitLab, for example inputs forwarded from a PR command.
          while IFS= read -r line; do
            [[ -n $line ]] || continue
            key=${line%%=*}
            pattern=${line#*=}
            if [[ $key == "$line" || ! $key =~ ^[A-Za-z_][A-Za-z0-9_]*$ || -z $pattern ]]; then
              fail "The variable pattern line '$line' is not of the form NAME=REGEX."
            fi
            [[ -n ${seen[$key]+set} && $key != EXPECTED_COMMIT_SHA ]] ||
              fail "The variable pattern names $key, which pipeline_variables does not set."
            value=${seen[$key]}
            status=0
            [[ $value =~ ^($pattern)$ ]] || status=$?
            [[ $status != 2 ]] || fail "The variable pattern for $key is not a valid extended regular expression."
            [[ $status == 0 ]] || fail "The pipeline variable $key has the value '$value', which does not match $pattern."
          done <<< "$VARIABLE_PATTERNS"
          delimiter=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          {
            echo "lines<<$delimiter"
            printf '%s\n' "${lines[@]}"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - name: Verify PR commit
        if: env.HPC_PULL_REQUEST != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ env.HPC_PULL_REQUEST }}
          SELECTED_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $SELECTED_SHA =~ ^[0-9a-f]{40}$ ]] || fail "The selected commit '$SELECTED_SHA' is not a full commit hash."
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          jq -e '.state == "open"' <<< "$pr" > /dev/null || fail "PR $PR is not open."
          jq -e --arg repo "$GITHUB_REPOSITORY" '.base.repo.full_name == $repo' <<< "$pr" > /dev/null ||
            fail "PR $PR does not target $GITHUB_REPOSITORY."
          # Any commit of the PR may run, not only its head, so earlier commits can be compared.
          commits=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --jq '.[].sha')
          grep -Fqx "$SELECTED_SHA" <<< "$commits" || fail "Commit $SELECTED_SHA does not belong to PR $PR."
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Use version 7.0.1.
        with:
          ref: ${{ env.HPC_SOURCE_SHA || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Push the selected commit to GitLab
        uses: pc2/github2lab_action@74a6aac30255fabf1717a7842bd5c2c3ae9b18ee
        env:
          MODE: mirror
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MIRROR_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
          MIRROR_BRANCH: ${{ env.HPC_SOURCE_SHA && format('hpc-pr-{0}-{1}', env.HPC_PULL_REQUEST, env.HPC_SOURCE_SHA) || github.ref_name }}
          MIRROR_ONLY: 'true'
          FORCE_PUSH: 'true'
      - name: Start GitLab pipeline
        id: trigger
        uses: pc2/github2lab_action@74a6aac30255fabf1717a7842bd5c2c3ae9b18ee
        env:
          MODE: trigger
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
          PIPELINE_REF: ${{ env.HPC_SOURCE_SHA && format('hpc-pr-{0}-{1}', env.HPC_PULL_REQUEST, env.HPC_SOURCE_SHA) || github.ref_name }}
          PIPELINE_VARIABLES: ${{ steps.variables.outputs.lines }}
      - name: Save pipeline context
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PIPELINE_ID: ${{ steps.trigger.outputs.pipeline_id }}
          PR: ${{ env.HPC_PULL_REQUEST }}
          SOURCE_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
          SOURCE_REF: ${{ env.HPC_SOURCE_SHA && format('hpc-pr-{0}-{1}', env.HPC_PULL_REQUEST, env.HPC_SOURCE_SHA) || github.ref_name }}
          BENCHMARK: ${{ inputs.benchmark }}
          EXPECTED_PIPELINE_STATUS: ${{ inputs.expected_pipeline_status }}
        run: |
          set -euo pipefail
          [[ $PIPELINE_ID =~ ^[1-9][0-9]*$ ]]
          pipeline=$(curl --fail --silent --show-error --retry 3 --max-time 60 \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOSTNAME/api/v4/projects/$GITLAB_PROJECT_ID/pipelines/$PIPELINE_ID")
          if ! jq -e --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" \
            --argjson project "$GITLAB_PROJECT_ID" --argjson id "$PIPELINE_ID" \
            '.sha == $sha and .ref == $ref and .project_id == $project and .id == $id
              and .source == "trigger"' <<< "$pipeline" > /dev/null; then
            echo "::error::GitLab pipeline $PIPELINE_ID runs commit $(jq -r .sha <<< "$pipeline") on $(jq -r .ref <<< "$pipeline") instead of $SOURCE_SHA on $SOURCE_REF." \
              "Add the EXPECTED_COMMIT_SHA workflow rule to .gitlab-ci.yml and cancel the pipeline in GitLab."
            exit 1
          fi
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          mkdir -p "$RUNNER_TEMP/hpc-context"
          jq -e 'type == "object" and ((.suites // []) | type == "array")' <<< "$BENCHMARK"
          jq -n --argjson benchmark "$BENCHMARK" --arg expected_status "$EXPECTED_PIPELINE_STATUS" \
            --arg workflow_sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_REF_NAME" \
            --arg repository "$GITHUB_REPOSITORY" --arg hostname "$GITLAB_HOSTNAME" \
            --arg sha "$SOURCE_SHA" --arg ref "$SOURCE_REF" --arg pr "$PR" \
            --argjson run "$GITHUB_RUN_ID" --argjson workflow "$workflow_id" \
            --argjson project "$GITLAB_PROJECT_ID" --argjson pipeline "$PIPELINE_ID" \
            --argjson started "$(date +%s)" \
            '{schema: 1, expected_pipeline_status: $expected_status, benchmark: $benchmark, workflow_sha: $workflow_sha, workflow_ref: $workflow_ref, repository: $repository, hostname: $hostname, project_id: $project,
              pipeline_id: $pipeline, sha: $sha, ref: $ref, pull_request: $pr,
              run_id: $run, workflow_id: $workflow, started_at: $started}' \
            > "$RUNNER_TEMP/hpc-context/context.json"
          printf 'Pipeline context belongs to GitHub run %s.\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Store pipeline context
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Use version 7.0.2.
        with:
          name: hpc-context
          path: ${{ runner.temp }}/hpc-context/context.json
          if-no-files-found: error
          retention-days: 30

  wait:
    name: Monitor GitLab jobs
    needs: start
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) &&
      (needs.start.result == 'success' || (inputs.context_run_id || github.event.inputs.context_run_id) != '' || github.run_attempt > 1)
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: write
      checks: write
    concurrency:
      group: hpc-monitor-${{ github.repository }}-${{ inputs.gitlab_project_id }}-${{ (inputs.context_run_id || github.event.inputs.context_run_id) || github.run_id }}
      cancel-in-progress: false
    env:
      CONTEXT_RUN_ID: ${{ (inputs.context_run_id || github.event.inputs.context_run_id) || github.run_id }}
    outputs:
      pipeline_id: ${{ steps.identity.outputs.pipeline_id }}
      sha: ${{ steps.identity.outputs.sha }}
      ref: ${{ steps.identity.outputs.ref }}
      pull_request: ${{ steps.identity.outputs.pull_request }}
      finished: ${{ steps.poll.outputs.finished }}
      benchmark: ${{ steps.identity.outputs.benchmark }}
      suites: ${{ steps.identity.outputs.suites }}
      expected_pipeline_status: ${{ steps.identity.outputs.expected_pipeline_status }}
    steps:
      - name: Verify context source
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $CONTEXT_RUN_ID =~ ^[1-9][0-9]*$ ]] || fail "context_run_id must be a GitHub run ID, not '$CONTEXT_RUN_ID'."
          [[ $MAX_WAIT_MINUTES =~ ^[1-9][0-9]*$ && $MAX_WAIT_MINUTES -le 330 ]] ||
            fail "max_wait_minutes must be between 1 and 330, not '$MAX_WAIT_MINUTES'."
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTEXT_RUN_ID")
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [[ -n $default_branch ]]
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg default "$default_branch" \
            --argjson workflow "$workflow_id" \
            '.repository.full_name == $repo and .head_repository.full_name == $repo
              and .workflow_id == $workflow
              and (.event == "workflow_dispatch" or .event == "schedule"
                or (.event == "push" and .head_branch == $default))' <<< "$origin" > /dev/null ||
            fail "Run $CONTEXT_RUN_ID was not started by this workflow in this repository, it cannot be resumed."
          printf 'workflow_id=%s\nsha=%s\nref=%s\n' "$workflow_id" \
            "$(jq -r .head_sha <<< "$origin")" "$(jq -r .head_branch <<< "$origin")" >> "$GITHUB_OUTPUT"
      - name: Download pipeline context
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # Use version 8.0.2.
        with:
          name: hpc-context
          run-id: ${{ env.CONTEXT_RUN_ID }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/hpc-context
      - name: Verify pipeline identity
        id: identity
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          ORIGIN_SHA: ${{ steps.origin.outputs.sha }}
          ORIGIN_REF: ${{ steps.origin.outputs.ref }}
          WORKFLOW_ID: ${{ steps.origin.outputs.workflow_id }}
        run: |
          set -euo pipefail
          : "${GITLAB_TOKEN:?Configure the GITLAB_TOKEN repository secret.}"
          context="$RUNNER_TEMP/hpc-context/context.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg host "$GITLAB_HOSTNAME" \
            --arg sha "$ORIGIN_SHA" --arg ref "$ORIGIN_REF" \
            --argjson project "$GITLAB_PROJECT_ID" --argjson run "$CONTEXT_RUN_ID" \
            --argjson workflow "$WORKFLOW_ID" \
            '.schema == 1 and .repository == $repo and .hostname == $host
              and .project_id == $project and .run_id == $run and .workflow_id == $workflow
              and (.workflow_sha // .sha) == $sha and (.sha | test("^[0-9a-f]{40}$")) and (.workflow_ref // .ref) == $ref
              and (.pipeline_id | type == "number" and . > 0 and floor == .)
              and (.pull_request | test("^([1-9][0-9]*)?$"))
              and ((if has("expected_pipeline_status") then .expected_pipeline_status else "success" end) | IN("success", "failed"))
              and (.started_at | type == "number" and . > 0 and floor == .)' "$context"
          pipeline_id=$(jq -r .pipeline_id "$context")
          ORIGIN_SHA=$(jq -r .sha "$context")
          ORIGIN_REF=$(jq -r .ref "$context")
          pipeline=$(curl --fail --silent --show-error --retry 3 --max-time 60 \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOSTNAME/api/v4/projects/$GITLAB_PROJECT_ID/pipelines/$pipeline_id")
          jq -e --arg sha "$ORIGIN_SHA" --arg ref "$ORIGIN_REF" \
            --argjson project "$GITLAB_PROJECT_ID" --argjson id "$pipeline_id" \
            '.sha == $sha and .ref == $ref and .project_id == $project and .id == $id
              and .source == "trigger"' <<< "$pipeline"
          {
            printf 'expected_pipeline_status=%s\n' "$(jq -r '.expected_pipeline_status // "success"' "$context")"
            printf 'benchmark=%s\nsuites=%s\n' "$(jq -c '.benchmark // {}' "$context")" "$(jq -c '.benchmark.suites // []' "$context")"
            printf 'pipeline_id=%s\nsha=%s\n' "$pipeline_id" "$ORIGIN_SHA"
            printf 'ref=%s\n' "$ORIGIN_REF"
            printf 'pull_request=%s\nstarted_at=%s\n' "$(jq -r .pull_request "$context")" "$(jq -r .started_at "$context")"
          } >> "$GITHUB_OUTPUT"
          {
            printf 'GitLab pipeline [%s](%s).\n\n' "$pipeline_id" "$(jq -r .web_url <<< "$pipeline")"
            printf 'Original commit %s.\n\n' "$ORIGIN_SHA"
            printf 'To resume manually, run the default branch caller with context_run_id set to %s.\n' "$CONTEXT_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Follow GitLab jobs
        id: poll
        continue-on-error: true
        uses: pc2/github2lab_action@74a6aac30255fabf1717a7842bd5c2c3ae9b18ee
        env:
          MODE: get_status
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPELINE_ID: ${{ steps.identity.outputs.pipeline_id }}
          TARGET_SHA: ${{ steps.identity.outputs.sha }}
          # The pipeline ID separates pipelines of the same commit, continuation runs find their checks by this prefix.
          CHECK_PREFIX: 'HPC #${{ steps.identity.outputs.pipeline_id }} / '
          # The bare prefix sorts before its job checks, so the pipeline summary leads the list.
          PIPELINE_CHECK_NAME: 'HPC #${{ steps.identity.outputs.pipeline_id }}'
          SET_STATUS: 'false'
          CHECK_RUNS: 'true'
          SUMMARY: 'true'
          LOG_TRACES: 'false'
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
          POLL_TIMEOUT: '60'
          STOP_ON_MANUAL: 'true'
      - name: Verify monitoring result
        shell: bash
        env:
          FINISHED: ${{ steps.poll.outputs.finished }}
        run: |
          [[ $FINISHED == 'true' || $FINISHED == 'false' ]]
      - name: Continue monitoring
        if: steps.poll.outputs.finished == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ steps.origin.outputs.workflow_id }}
          STARTED_AT: ${{ steps.identity.outputs.started_at }}
        run: |
          set -euo pipefail
          if (( $(date +%s) - STARTED_AT >= 604800 )); then
            echo '::error::Automatic monitoring reached seven days, resume manually using the original context run ID.'
            exit 1
          fi
          # A failed dispatch would leave the pipeline unmonitored, so transient API errors are retried.
          for attempt in 1 2 3 4 5; do
            if default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch) && [[ -n $default_branch ]] &&
              gh workflow run "$WORKFLOW_ID" --repo "$GITHUB_REPOSITORY" --ref "$default_branch" \
                --field "context_run_id=$CONTEXT_RUN_ID"; then
              echo 'Another GitHub run will continue monitoring the same GitLab pipeline.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Dispatching the continuation failed, attempt $attempt."
            sleep 60
          done
          echo "::error::Continuation could not be dispatched, resume manually with context run ID $CONTEXT_RUN_ID."
          exit 1

  collect:
    name: Collect results
    needs: wait
    # A finished pipeline is collected, a PR run that failed before reaching this job is reported to the PR instead.
    if: >-
      ${{ !cancelled() && (needs.wait.outputs.finished == 'true' ||
      (failure() && (inputs.pull_request || github.event.inputs.pull_request) != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.collect_timeout_minutes) }}
    outputs:
      pipeline_status: ${{ steps.identity.outputs.status }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: hpc-collect-${{ github.repository }}-${{ inputs.gitlab_project_id }}-${{ needs.wait.outputs.pipeline_id || github.run_id }}
      cancel-in-progress: false
    env:
      FINISHED: ${{ needs.wait.outputs.finished }}
      PIPELINE_ID: ${{ needs.wait.outputs.pipeline_id }}
      EXPECTED_SHA: ${{ needs.wait.outputs.sha }}
      PIPELINE_REF: ${{ needs.wait.outputs.ref }}
      PR: ${{ needs.wait.outputs.pull_request }}
    steps:
      - name: Verify completed pipeline
        if: env.FINISHED == 'true'
        id: identity
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          pipeline=$(curl --fail --silent --show-error --retry 3 --max-time 60 \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            "https://$GITLAB_HOSTNAME/api/v4/projects/$GITLAB_PROJECT_ID/pipelines/$PIPELINE_ID")
          jq -e --arg sha "$EXPECTED_SHA" --arg ref "$PIPELINE_REF" \
            --argjson project "$GITLAB_PROJECT_ID" --argjson id "$PIPELINE_ID" \
            '.sha == $sha and .ref == $ref and .project_id == $project and .id == $id
              and .source == "trigger"
              and (.status | IN("success", "failed", "canceled", "skipped", "manual"))' <<< "$pipeline"
          printf 'status=%s\nweb_url=%s\n' "$(jq -r .status <<< "$pipeline")" "$(jq -r .web_url <<< "$pipeline")" >> "$GITHUB_OUTPUT"
      - name: Prepare artifact download
        if: env.FINISHED == 'true'
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python3 -I -m venv "$RUNNER_TEMP/github2lab-python"
          cat > "$RUNNER_TEMP/github2lab-python/requirements.txt" <<'EOF'
          certifi==2026.10.23 \
              --hash=sha256:e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1
          charset-normalizer==3.5.2 \
              --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
          idna==3.20 \
              --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          requests==2.34.2 \
              --hash=sha256:2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
          urllib3==2.8.0 \
              --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
          EOF
          "$RUNNER_TEMP/github2lab-python/bin/python" -I -m pip install --require-hashes --only-binary :all: \
            -r "$RUNNER_TEMP/github2lab-python/requirements.txt"
          echo "$RUNNER_TEMP/github2lab-python/bin" >> "$GITHUB_PATH"
      - name: Collect GitLab artifacts
        if: env.FINISHED == 'true'
        id: artifacts
        uses: pc2/github2lab_action@74a6aac30255fabf1717a7842bd5c2c3ae9b18ee
        env:
          MODE: get_artifact
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          PIPELINE_ID: ${{ env.PIPELINE_ID }}
          ARTIFACT_DIR: ${{ runner.temp }}/hpc-artifacts
          UPLOAD_ARTIFACTS: 'false'
      - name: Upload GitLab artifacts
        id: upload
        if: always() && steps.identity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Use version 7.0.2.
        with:
          name: gitlab-${{ inputs.gitlab_project_id }}-${{ env.PIPELINE_ID }}
          path: ${{ runner.temp }}/hpc-artifacts/
          overwrite: true
          if-no-files-found: warn
          retention-days: 30
          # The collected files are zip archives already.
          compression-level: 0
      - name: Report to the PR
        if: always() && steps.identity.outcome == 'success' && env.PR != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.identity.outputs.status }}
          WEB_URL: ${{ steps.identity.outputs.web_url }}
          DOWNLOAD_OUTCOME: ${{ steps.artifacts.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '.base.repo.full_name == $repo'
          marker="<!-- hpc-cb:$GITLAB_PROJECT_ID:$PIPELINE_ID -->"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" |
            jq -sr --arg marker "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))] | first.id // empty')
          body=$(printf '%s\n\nPipeline [%s](%s) for commit [%s](%s/%s/commit/%s) finished with **%s**.\n\nArtifact download finished with **%s**.\nArtifact upload finished with **%s**.\n\n[GitHub run](%s/%s/actions/runs/%s).\n' \
            "$marker" "$PIPELINE_ID" "$WEB_URL" "$EXPECTED_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$EXPECTED_SHA" "$STATUS" "$DOWNLOAD_OUTCOME" "$UPLOAD_OUTCOME" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [[ -n $comment_id ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --raw-field "body=$body" --silent
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --raw-field "body=$body" --silent
          fi
      - name: Set final result
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        env:
          STATUS: ${{ steps.identity.outputs.status }}
          DOWNLOAD_OUTCOME: ${{ steps.artifacts.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          EXPECTED_PIPELINE_STATUS: ${{ needs.wait.outputs.expected_pipeline_status }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }
          [[ $EXPECTED_PIPELINE_STATUS == success || $EXPECTED_PIPELINE_STATUS == failed ]]
          printf 'GitLab pipeline status %s, expected %s.\n' "$STATUS" "$EXPECTED_PIPELINE_STATUS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Collected %s GitLab job archives.\n' "$(find "$RUNNER_TEMP/hpc-artifacts" -type f 2> /dev/null | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          [[ $STATUS == "$EXPECTED_PIPELINE_STATUS" ]] ||
            fail "The GitLab pipeline finished with $STATUS, expected $EXPECTED_PIPELINE_STATUS."
          [[ $DOWNLOAD_OUTCOME == success ]] || fail 'Downloading the GitLab artifacts failed, see the Collect GitLab artifacts step.'
          [[ $UPLOAD_OUTCOME == success ]] || fail 'Uploading the artifacts to GitHub failed, see the Upload GitLab artifacts step.'
      - name: Report a failed run to the PR
        if: env.FINISHED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ env.HPC_PULL_REQUEST }}
          SELECTED_SHA: ${{ env.HPC_SOURCE_SHA || github.sha }}
        run: |
          set -euo pipefail
          [[ $PR =~ ^[1-9][0-9]*$ ]] || exit 0
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" |
            jq -r 'first(.jobs[] | select(.conclusion == "failure") | .name as $job
              | (.steps[] | select(.conclusion == "failure") | "\($job), step \(.name)")) // "an unknown step"')
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body=$(printf '<!-- hpc-failure:%s:%s -->\n\nThe HPC run for commit %s failed in %s.\n[GitHub run](%s).\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SELECTED_SHA" "$failed" "$url")
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --raw-field "body=$body" --silent

  benchmark:
    needs: [wait, collect]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.collect.outputs.pipeline_status == 'success' && needs.wait.outputs.suites != '[]' && needs.wait.outputs.suites != '' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: ${{ fromJSON(needs.wait.outputs.suites) }}
    uses: ./.github/workflows/benchmark.yml
    with:
      context_run_id: ${{ (inputs.context_run_id || github.event.inputs.context_run_id) || github.run_id }}
      artifact: gitlab-${{ inputs.gitlab_project_id }}-${{ needs.wait.outputs.pipeline_id }}
      config: ${{ needs.wait.outputs.benchmark }}
      suite: ${{ toJSON(matrix.suite) }}

  pages:
    needs: [wait, benchmark]
    if: ${{ !cancelled() && (needs.benchmark.result == 'success' || needs.benchmark.result == 'failure') && needs.wait.outputs.pull_request == '' && fromJSON(needs.wait.outputs.benchmark).mode == 'pages' }}
    uses: ./.github/workflows/benchmark-pages.yml
    with:
      branch: ${{ fromJSON(needs.wait.outputs.benchmark).branch || 'hpc-results' }}
