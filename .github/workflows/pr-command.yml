name: HPC command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  hpc:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/hpc')
    uses: ./.github/workflows/hpc-command.yml
    with:
      workflow: hpc-pr.yml
