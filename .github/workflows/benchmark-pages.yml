name: Publish benchmark Pages

on:
  workflow_call:
    inputs:
      branch:
        type: string
        default: hpc-results

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hpc-benchmark-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # Use version 5.0.0.
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # Use version 5.0.1.
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
