name: HPC command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  dispatch:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/hpc')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize and dispatch the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CB_TEST_ACTOR: ${{ vars.CB_TEST_ACTOR }}
          CB_COMMAND_ROLES: ${{ vars.CB_COMMAND_ROLES || 'admin maintain' }}
          CB_COMMAND_WORKFLOW: ${{ vars.CB_COMMAND_WORKFLOW || 'hpc-pr.yml' }}
        run: |
          python3 - <<'PY'
          """Authorize a reviewed PR commit and dispatch its HPC caller."""
          
          import json
          import os
          import re
          import subprocess
          
          
          def api(path, body=None):
              args = ['gh', 'api', '-H', 'X-GitHub-Api-Version: 2026-03-10', path]
              if body is not None:
                  args += ['--method', 'POST', '--input', '-']
              result = subprocess.run(args, input=json.dumps(body) if body is not None else None,
                                      text=True, capture_output=True, check=True, timeout=60)
              return json.loads(result.stdout) if result.stdout else None
          
          
          def authorized_test_pr(pr, login, expected_login, repo):
              return bool(expected_login and login.lower() == expected_login.lower() and
                          pr['user']['login'].lower() == expected_login.lower() and
                          pr['head']['repo']['full_name'] == repo and
                          re.fullmatch(r'hpc-test/[0-9]+-[0-9]+/(pass|fail)', pr['head']['ref']) and
                          pr['title'].startswith('HPC integration test '))
          
          
          def main():
              event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
              body = event['comment']['body'].strip()
              if 'pull_request' not in event['issue'] or not re.fullmatch(r'/hpc(\s.*)?', body, re.DOTALL):
                  return
              repo = os.environ['GITHUB_REPOSITORY']
              number = event['issue']['number']
              login = event['comment']['user']['login']
              marker = f'<!-- hpc-command:{event["comment"]["id"]} -->'
              pr = api(f'repos/{repo}/pulls/{number}')
              if pr['state'] != 'open':
                  raise ValueError('The PR is not open.')
              test = authorized_test_pr(pr, login, os.environ.get('CB_TEST_ACTOR', ''), repo)
              if test:
                  files = api(f'repos/{repo}/pulls/{number}/files?per_page=100')
                  if len(files) != 1 or files[0]['filename'] != 'benchmarks/pr-fixture.json':
                      raise ValueError('The integration PR changed files outside its fixture.')
              else:
                  role = api(f'repos/{repo}/collaborators/{login}/permission')['role_name']
                  if role not in os.environ.get('CB_COMMAND_ROLES', 'admin maintain').split():
                      raise ValueError('The commenter cannot authorize cluster execution.')
              sha = pr['head']['sha']
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise ValueError('Invalid PR commit.')
              # The comment names the reviewed commit, the PR head may have moved since the review.
              reviewed = re.fullmatch(r'/hpc\s+([0-9a-f]{7,40})', body)
              if not reviewed or not sha.startswith(reviewed[1]):
                  reason = (f'The PR head is {sha}, which is not the named commit {reviewed[1]}.' if reviewed
                            else 'Name the reviewed commit, for example `/hpc ' + sha[:12] + '`.')
                  api(f'repos/{repo}/issues/{number}/comments', dict(body=f'{marker}\n\nNot dispatched. {reason}'))
                  raise ValueError(reason)
              workflow = os.environ.get('CB_COMMAND_WORKFLOW') or 'hpc-pr.yml'
              result = api(f'repos/{repo}/actions/workflows/{workflow}/dispatches',
                           dict(ref=event['repository']['default_branch'],
                                inputs=dict(pull_request=str(number), source_sha=sha), return_run_details=True))
              run_id = result['workflow_run_id']
              api(f'repos/{repo}/issues/{number}/comments',
                  dict(body=f'{marker}\n\nAuthorized commit {sha}.\n[HPC run](https://github.com/{repo}/actions/runs/{run_id}).'))
          
          
          if __name__ == '__main__':
              main()
          PY
