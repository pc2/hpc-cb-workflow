mode: pages
branch: hpc-results
suites:
  - match: "Linear *"
    alert_threshold: 200%
    fail_threshold: 1000%
  - name: "Solve {statistic}"
    archive: benchmark.zip
    file: results/linear-solve-{statistic}.json
    alert_threshold: 200%
    fail_threshold: 1000%
    matrix:
      statistic: [median, minimum]
