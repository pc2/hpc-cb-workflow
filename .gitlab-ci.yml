# Jobs for the integration workflow, SCENARIO selects the pipeline outcome.

workflow:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "trigger" &&
        $EXPECTED_COMMIT_SHA == $CI_COMMIT_SHA

variables:
  INTEGRATION_RUNNER_TAG: otus-shell
  GIT_DEPTH: "1"
  BENCHMARK_JULIA_MODULE: lang/JuliaHPC/1.10.12-foss-2025a
  BENCHMARK_RUNNER_TAG: otus-slurm
  BENCHMARK_SCHEDULER_PARAMETERS: "-A hpc-prf-cobentx -q express -p normal -N 1 -n 1 -c 1 --mem=2G -t 00:05:00"

default:
  tags: [$INTEGRATION_RUNNER_TAG]
  id_tokens:
    CI_JOB_JWT:
      aud: https://git.uni-paderborn.de

quick:
  script:
    - mkdir -p results
    - printf '%s\n' "$CI_COMMIT_SHA" > results/commit.txt
  artifacts:
    paths: [results/]
    expire_in: 1 day

fail:
  rules:
    - if: $SCENARIO == "failure"
  script:
    - exit 1

# Outlasts the one minute monitoring deadline of the handover scenario.
slow:
  rules:
    - if: $SCENARIO == "handover" || $SCENARIO == "handover_failure"
  script:
    - mkdir -p results
    - printf '%s\n' "$CI_COMMIT_SHA" > results/commit.txt
    - sleep 180
    - |
      if [ "$SCENARIO" = handover_failure ]; then
        mkdir -p results
        printf '%s\n' "$CI_COMMIT_SHA" > results/failure.txt
        exit 1
      fi
  artifacts:
    when: always
    paths: [results/]
    expire_in: 1 day

benchmark:
  tags: [$BENCHMARK_RUNNER_TAG]
  timeout: 7 days
  variables:
    SCHEDULER_PARAMETERS: $BENCHMARK_SCHEDULER_PARAMETERS
    JACAMAR_SCHEDULER_JOB_PREFIX: cb-benchmark
  rules:
    - if: $SCENARIO == "benchmark"
  script:
    - ': "${SLURM_JOB_ID:?The benchmark requires a Slurm allocation.}"'
    - mkdir -p results
    - printf '%s\n' "$SLURM_JOB_ID" > results/slurm-job-id.txt
    - module load "$BENCHMARK_JULIA_MODULE"
    - julia --startup-file=no --threads=1 benchmarks/linear_solve.jl
  artifacts:
    paths: [results/]
    expire_in: 30 days

regression:
  rules:
    - if: $SCENARIO == "regression"
  script:
    - mkdir -p results
    - cp benchmarks/pr-fixture.json results/benchmark-action.json
    - if [ "${HANDOVER:-false}" = true ]; then sleep 180; fi
  artifacts:
    paths: [results/]
    expire_in: 30 days
